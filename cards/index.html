<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok Agent Cards</title>
<meta name="description" content="Card gallery of Grok-powered apps, agents, and CLIs from Awesome Grok.">
<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --border: #e3e3e8; --text: #16161a;
    --muted: #5e5e6b; --accent: #2b59c3; --chip: #eef1f8; --star: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f12; --surface: #18181d; --border: #2a2a32; --text: #ececf1;
      --muted: #a0a0ad; --accent: #7fa2ff; --chip: #23232b; --star: #f0b54a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0f12; --surface: #18181d; --border: #2a2a32; --text: #ececf1;
    --muted: #a0a0ad; --accent: #7fa2ff; --chip: #23232b; --star: #f0b54a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.75rem; }
  header p { margin: 0 0 24px; color: var(--muted); }
  header a { color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 20px; }
  #filters { margin-bottom: 0; }
  .controls input {
    flex: 1 1 220px; min-width: 0; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit;
  }
  .controls button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font: inherit; cursor: pointer;
  }
  .controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column; gap: 8px; padding: 18px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    color: inherit; text-decoration: none; transition: border-color .15s;
  }
  .card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
  .card h2 { margin: 0; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
  .card .featured { color: var(--star); font-size: .8rem; font-weight: 600; }
  .card .cat { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  .card p { margin: 0; color: var(--muted); flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .78rem; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Grok Agent Cards</h1>
    <p>Apps, agents, and CLIs built on Grok — from <a href="../README.md">Awesome Grok</a>.</p>
  </header>
  <div class="controls" role="search">
    <input id="q" type="search" placeholder="Search agents, tags…" aria-label="Search agents">
    <div id="filters"></div>
  </div>
  <section id="grid" class="grid" aria-live="polite"></section>
</main>
<script>
  const grid = document.getElementById('grid');
  const filters = document.getElementById('filters');
  const q = document.getElementById('q');
  let agents = [];
  let category = 'All';

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function render() {
    const term = q.value.trim().toLowerCase();
    const shown = agents.filter(a =>
      (category === 'All' || a.category === category) &&
      (!term || [a.name, a.description, ...(a.tags || [])].join(' ').toLowerCase().includes(term)));
    grid.innerHTML = shown.length ? shown.map(a => `
      <a class="card" href="${esc(a.url)}" target="_blank" rel="noopener">
        <span class="cat">${esc(a.category)}</span>
        <h2>${esc(a.name)}${a.featured ? '<span class="featured">★ Featured</span>' : ''}</h2>
        <p>${esc(a.description)}</p>
        <div class="tags">${(a.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
      </a>`).join('') : '<p class="empty">No agents match.</p>';
  }

  function renderFilters() {
    const cats = ['All', ...new Set(agents.map(a => a.category))];
    filters.className = 'controls';
    filters.innerHTML = cats.map(c =>
      `<button type="button" data-cat="${esc(c)}" aria-pressed="${c === category}">${esc(c)}</button>`).join('');
  }

  filters.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    category = btn.dataset.cat;
    renderFilters();
    render();
  });
  q.addEventListener('input', render);

  fetch('agents.json')
    .then(r => r.json())
    .then(data => {
      agents = data.sort((a, b) => (b.featured === true) - (a.featured === true) || a.name.localeCompare(b.name));
      renderFilters();
      render();
    })
    .catch(() => { grid.innerHTML = '<p class="empty">Could not load agents.json — serve this folder over HTTP.</p>'; });
</script>
</body>
</html>
