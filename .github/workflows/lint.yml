name: Lint

on:
  pull_request:
    paths: ["**.md", ".markdownlint-cli2.jsonc", ".github/workflows/lint.yml"]
  push:
    branches: [main]
    paths: ["**.md", ".markdownlint-cli2.jsonc", ".github/workflows/lint.yml"]

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y markdownlint-cli2@0.18.1 README.md
