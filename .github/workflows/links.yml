name: Links

# Weekly and on demand only: many listed sites rate-limit or block CI runners,
# so this should not gate pull requests.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept '200..=299,403,429'
            --exclude '^https?://(www\.)?(x|twitter)\.com'
            --max-retries 3
            --timeout 30
            README.md
          fail: true
